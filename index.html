<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">

  <title>PELOCO — $PELOCO</title>

  <meta
    name="description"
    content="PELOCO $PELOCO — From one nest to the world. 🐣💛"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 204, 0, 0.12),
          transparent 35%
        ),
        #0A0A0A;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 18px 40px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* LOGO */
    .logo {
      width: 100px;
      height: 100px;
      margin: 20px auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #ffcc00;
      color: #0A0A0A;

      font-size: 52px;
      font-weight: 900;

      box-shadow:
        0 0 50px rgba(255, 204, 0, 0.15);
    }

    /* TITLE */
    h1 {
      margin: 0;

      font-size: 52px;
      line-height: 1;

      font-weight: 900;
      letter-spacing: -3px;

      color: #ffcc00;
    }

    .ticker {
      color: #fff;
    }

    .headline {
      margin: 18px auto 8px;

      font-size: 17px;
      line-height: 1.5;

      max-width: 360px;

      color: #f1f1f1;
    }

    .origin {
      margin: 0 0 30px;

      color: #888;
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    /* BUTTONS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      border-radius: 15px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 900;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: #ffcc00;
      color: #000;

      box-shadow:
        0 10px 30px rgba(255, 204, 0, 0.12);
    }

    .primary:hover {
      box-shadow:
        0 14px 35px rgba(255, 204, 0, 0.20);
    }

    .secondary {
      background: #151515;
      color: #fff;

      border: 1px solid #292929;
    }

    .secondary:hover {
      border-color: #ffcc00;
    }

    .arrow {
      opacity: 0.5;
      font-size: 18px;
    }

    /* CONTRACT */
    .contract {
      margin-top: 30px;
      padding: 15px;

      background: #111;
      border: 1px dashed #333;

      border-radius: 14px;
    }

    .contract-title {
      margin-bottom: 9px;

      color: #777;

      font-size: 9px;
      font-weight: 900;

      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .address {
      font-family: monospace;

      font-size: 10px;
      line-height: 1.6;

      color: #ccc;

      word-break: break-all;
    }

    .copy {
      width: 100%;

      margin-top: 12px;
      padding: 10px;

      border: 0;
      border-radius: 9px;

      background: #1b1b1b;
      color: #888;

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .copy:hover {
      color: #ffcc00;
      background: #222;
    }

    /* FOOTER */
    footer {
      margin-top: 35px;
      padding-top: 18px;

      border-top: 1px solid #1d1d1d;

      color: #555;

      font-size: 10px;
      line-height: 1.6;
    }

    footer strong {
      color: #777;
    }

    /* MOBILE */
    @media (max-width: 420px) {

      body {
        padding: 20px 15px 30px;
      }

      .logo {
        width: 88px;
        height: 88px;
        font-size: 44px;
      }

      h1 {
        font-size: 43px;
      }

      .headline {
        font-size: 15px;
      }

      .btn {
        min-height: 55px;
        font-size: 13px;
      }

      .address {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- PELOCO LOGO -->
    <div class="logo">P</div>

    <!-- BRAND -->
    <h1>
      PELOCO <span class="ticker">$PELOCO</span>
    </h1>

    <p class="headline">
      The fluffiest meme on the blockchain.
    </p>

    <p class="origin">
      From one nest to the world. 🐣💛
    </p>

    <!-- OFFICIAL LINKS -->
    <div class="links">

      <a
        class="btn primary"
        href="https://join.pump.fun/HSag/bzak5fc1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🚀 BUY ON PUMP.FUN</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn secondary"
        href="https://dexscreener.com/solana/HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>📊 DEXSCREENER</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn secondary"
        href="https://solscan.io/token/HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🔎 SOLSCAN</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn secondary"
        href="https://x.com/PelocoCoin"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🐦 X @PelocoCoin</span>
        <span class="arrow">→</span>
      </a>

    </div>

    <!-- CONTRACT ADDRESS -->
    <div class="contract">

      <div class="contract-title">
        Contract Address · Solana
      </div>

      <div
        class="address"
        id="contract"
      >
        HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump
      </div>

      <button
        class="copy"
        id="copyButton"
        type="button"
        onclick="copyContract()"
      >
        COPY CONTRACT ADDRESS
      </button>

    </div>

    <!-- FOOTER -->
    <footer>

      <strong>PELOCO $PELOCO</strong>

      <br>

      From Family to Community 🐣💛

      <br><br>

      From one nest to the world.

    </footer>

  </main>

  <script>

    function copyContract() {

      const address =
        "HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump";

      const button =
        document.getElementById("copyButton");

      navigator.clipboard.writeText(address)

        .then(() => {

          button.textContent = "✓ COPIED";

          setTimeout(() => {
            button.textContent =
              "COPY CONTRACT ADDRESS";
          }, 1800);

        })

        .catch(() => {

          button.textContent =
            "COPY FAILED";

          setTimeout(() => {
            button.textContent =
              "COPY CONTRACT ADDRESS";
          }, 1800);

        });
    }

  </script>

</body>

</html>
